 .grid{grid-template-columns:minmax(0,1fr)}
 .gcol .pDonut,.gcol .pOp,.gcol .pDecomp{grid-column:1;grid-row:auto}
}
.panel{min-width:0}

.i{cursor:help;color:#1f4e79;font-size:10px;border:1px solid #9db4cf;border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;font-weight:700;vertical-align:middle}
canvas{max-height:260px}
.good{color:var(--good)}.bad{color:var(--bad)}.amber{color:var(--amber)}

th.colsel,td.colsel{background:#eaf3fc}

.lvl0>td:first-child{font-weight:700}.lvl1>td:first-child{padding-left:22px}.lvl2>td:first-child{padding-left:40px;color:#3a4a59}.lvl3>td:first-child{padding-left:58px;color:#6b7785;font-size:11px}

.exp{cursor:pointer;display:inline-block;width:14px;color:#1f4e79;user-select:none}
.nm{cursor:pointer}.nm:hover{text-decoration:underline}
.mxwrap{max-height:340px;overflow:auto;scrollbar-gutter:stable}
.dc-wrap{scrollbar-gutter:stable}
.tmap{position:relative;width:100%;height:230px}
.tmap .tile{position:absolute;overflow:hidden;cursor:pointer;border:2px solid #fff;color:#fff;padding:6px 8px;transition:filter .15s;box-sizing:border-box}
.tmap .tile:hover{filter:brightness(1.08)}
.tmap .tile.tsel{outline:2px solid #1f2733;outline-offset:-2px}
.tmap .tnm{font-weight:700;font-size:12px;line-height:1.2}
.tmap .tval{font-size:11px;opacity:.92;margin-top:2px}
.tmap .empty{display:flex;align-items:center;justify-content:center;height:100%;color:#6b7785;font-size:13px}
#__pop{position:fixed;max-width:340px;background:#1f2733;color:#fff;font-size:12px;line-height:1.5;padding:10px 12px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.28);z-index:9999;display:none}
.notes details{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px;background:#fafbfd;font-size:12px}
.notes summary{cursor:pointer;font-weight:600;color:var(--brand)}.notes .body{margin-top:6px;color:#41505f;line-height:1.5}

.tag-ok{background:#eafaf1;color:#1e8449}.tag-w{background:#fdecea;color:#b03a2e}.tag-i{background:#eaf2fb;color:#1f4e79}
.foot{color:var(--muted);font-size:11px;margin-top:16px;border-top:1px solid var(--line);padding-top:10px;line-height:1.5}
@keyframes coeSwapIn{from{opacity:.4}to{opacity:1}}
.swapin{animation:coeSwapIn .2s ease-out}
@media(prefers-reduced-motion:reduce){.swapin{animation:none}}
#decomp{overflow-x:auto;max-width:100%}
body.dark{--bg:#0f1720;--card:#1a2632;--ink:#e6ebf0;--muted:#93a1b0;--line:#2b3a49;--brand:#6ea8dc;--brand2:#6ea8dc}

body.dark .dc-sel{background:#2e5b86;border-color:#2e5b86}

body.dark .dc-pick{border-color:#3a5878;color:var(--brand)}
body.dark .dc-pick:hover{background:#22303d}
